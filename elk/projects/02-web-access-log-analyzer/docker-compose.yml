# docker-compose.yml — ELK Project 2 (Web Access Log Analyzer)
#
# Runs TWO containers that share a log folder:
#   1. web-access-log-analyzer — generates raw Apache-style access logs in /var/log/web/access.log
#   2. filebeat                — tails that file and ships the lines to LOGSTASH (for parsing)
#
# Both join the pre-existing 'elk' network so Filebeat can reach logstash:5044.
#
# Prerequisite: the ELK stack must be running (docker compose up -d in elk/02-setup/).
#               Logstash must be up — it does the parsing for this project.
#
# Start:   docker compose up -d --build
# Stop:    docker compose down
# Wipe:    docker compose down -v   (also clears the shared web-logs volume)

services:

  web-access-log-analyzer:
    build: ./app
    container_name: web-access-log-analyzer
    restart: unless-stopped
    environment:
      - LOG_FILE=/var/log/web/access.log
    ports:
      - "8092:8092"
    volumes:
      - weblogs:/var/log/web    # the app WRITES raw access logs here
    networks:
      - elk

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: filebeat-web-access
    restart: unless-stopped
    command: ["filebeat", "-e", "--strict.perms=false"]
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - weblogs:/var/log/web:ro   # filebeat READS the same logs (read-only)
    depends_on:
      - web-access-log-analyzer
    networks:
      - elk

volumes:
  weblogs:                   # shared between the app (writer) and filebeat (reader)

networks:
  elk:
    # external: true — join the 'elk' network created by elk/02-setup/.
    external: true
