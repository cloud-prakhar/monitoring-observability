# elk/02-setup/config/pipeline/logstash.conf
#
# The Logstash PIPELINE — this is the ETL (Extract → Transform → Load).
# Project 2 (web-access-log-analyzer) sends raw web access logs here to be parsed.
# (Project 1 skips Logstash entirely — its JSON logs go straight to Elasticsearch.)
#
# Three blocks, matching the three letters of ETL:

# ---------------------------------------------------------------------------
# EXTRACT — receive raw logs from Filebeat over the Beats protocol on port 5044
# ---------------------------------------------------------------------------
input {
  beats {
    port => 5044
  }
}

# ---------------------------------------------------------------------------
# TRANSFORM — turn one messy text line into clean, typed fields
# ---------------------------------------------------------------------------
filter {

  # Filebeat injects its own metadata, including an 'agent' OBJECT describing Filebeat itself.
  # That collides with the user-agent field grok is about to extract (also named 'agent'),
  # so drop the Beats metadata first. This keeps the parsed document clean and avoids a
  # field-type conflict in Elasticsearch (object vs. string).
  mutate {
    remove_field => [ "agent", "ecs", "input", "log", "host", "tags", "@version" ]
  }

  # grok parses text using named patterns. COMBINEDAPACHELOG is a built-in pattern
  # that already knows the shape of a standard web access log line, so this one line
  # unpacks: clientip, timestamp, verb (method), request (url), response (status), bytes,
  # referrer, and agent (the browser/user-agent string).
  grok {
    match => { "message" => "%{COMBINEDAPACHELOG}" }
    # If a line doesn't match, tag it so you can spot parsing failures in Kibana.
    tag_on_failure => ["_grokparsefailure"]
  }

  # Use the timestamp FROM THE LOG as the event time (not the time Logstash received it).
  date {
    match  => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    target => "@timestamp"
  }

  # Fix data types so Kibana can do ranges/math: "500" (text) -> 500 (number).
  mutate {
    convert => {
      "response" => "integer"
      "bytes"    => "integer"
    }
  }
}

# ---------------------------------------------------------------------------
# LOAD — write the finished JSON document into Elasticsearch (one index per day)
# ---------------------------------------------------------------------------
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "web-access-%{+YYYY.MM.dd}"
  }

  # Also print to the Logstash container logs — handy while learning.
  # See it with: docker logs logstash
  stdout {
    codec => rubydebug
  }
}
